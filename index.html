<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>GT Peso Materiali</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Colori provvisori dello scheletro: contrasto da verificare in Fase 2. */
  :root {
    --bg: #ffffff;
    --fg: #14171a;
    --muted: #4b5560;
    --line: #c9d1d9;
    --accent: #0a58ca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013;
      --fg: #f2f4f6;
      --muted: #aab4bf;
      --line: #3a424b;
      --accent: #7db2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-text-size-adjust: 100%;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left));
  }
  h1 { font-size: 1.4rem; margin: 0 0 8px; color: var(--accent); }
  p { margin: 0 0 12px; }
  footer {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>Peso teorico dei materiali</h1>
  <p>Scheletro del progetto: interfaccia in costruzione.</p>
</main>
<footer id="footer"></footer>

</body>
</html>
